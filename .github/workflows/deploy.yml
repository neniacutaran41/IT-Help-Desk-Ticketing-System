name: Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ftp-deploy:
    name: 🚀 Sync Files to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches the previous commit so git diff can detect only changed files

      - name: 📂 Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'htdocs/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            database.sql
            DEPLOYMENT_GUIDE.md
            README.md
            cookies.txt
            config/database.local.php.example
